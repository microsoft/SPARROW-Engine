[model]
id = "synthetic-classifier-dynamic"
format = "onnx"
file = "model.onnx"

[preprocessing]
method = "resize"
input_size = [2, 2]
layout = "nchw"
normalization = "unit"
interpolation = "nearest"

[inference]
strategy = "single"

[postprocessing]
method = "softmax"

[labels]
file = "labels.txt"
format = "one_per_line"
